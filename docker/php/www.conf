; Pool de PHP-FPM para Ventio
; clear_env = no permite que las variables de entorno del contenedor
; (APP_KEY, DB_*, etc.) lleguen a los workers de PHP-FPM.
[www]
clear_env = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
